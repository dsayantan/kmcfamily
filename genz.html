<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMC GenZ Voters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--muted:#5f6b7a;--line:#e3e7ec;--soft:#f0f3f6;
  --accent:#b3261e;--accent-ink:#fff;--hl:#fff1a8;--m:#2f6fb3;--f:#b5418a;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417;--panel:#1b1e23;--ink:#e7eaee;--muted:#9aa5b1;--line:#2c3138;--soft:#22262c;
  --accent:#e35d52;--accent-ink:#fff;--hl:#5c4d00;--m:#7fb2ea;--f:#e58cc4;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#121417;--panel:#1b1e23;--ink:#e7eaee;--muted:#9aa5b1;--line:#2c3138;--soft:#22262c;
  --accent:#e35d52;--accent-ink:#fff;--hl:#5c4d00;--m:#7fb2ea;--f:#e58cc4;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Noto Sans Bengali",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
h1{font-size:17px;margin:0 16px 0 0;align-self:center;white-space:nowrap}
h1 span{color:var(--accent)}
label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px;font-weight:500}
select,input,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-height:34px}
select{max-width:320px}
input[type=search]{width:230px}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
main{max-width:1200px;margin:0 auto;padding:14px 16px 60px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted)}
.note{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px;color:var(--muted)}
.status{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:4px 0 10px;color:var(--muted)}
.pager{display:flex;gap:6px;align-items:center}
.fam{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.fh{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line)}
.fh .id{font-weight:700}
.fh .meta{color:var(--muted);font-size:12.5px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sx{font-weight:600}.sx.M{color:var(--m)}.sx.F{color:var(--f)}
.epic{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:nowrap}
.rel{color:var(--muted);font-size:12.5px}
.links{font-size:12px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.theme{margin-left:auto}
.actions{display:flex;gap:8px;align-items:end}
.golink{align-self:center;order:99;margin-left:auto;padding:7px 14px;border-radius:999px;border:2px solid var(--accent);
  color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap}
.golink:hover{background:var(--accent);color:var(--accent-ink)}
.srow{display:flex}
.srow select{border-radius:7px 0 0 7px;border-right:0;background:var(--soft);max-width:150px}
.srow input{border-radius:0 7px 7px 0;flex:1;min-width:0}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:-4px 0 10px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.hint{color:var(--accent);font-weight:500}
@media (max-width:700px){
  header{position:static}
  .bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  h1,.wide,.actions,.golink{grid-column:1/-1}
  .golink{order:0;margin-left:0;text-align:center;padding:8px}
  label{min-width:0}
  select,input[type=search]{width:100%;min-width:0;max-width:none}
  .srow select{width:auto;flex:0 0 auto;max-width:44%}
  .actions button{flex:1;min-height:40px;white-space:nowrap;padding:6px}
  .actions .theme{flex:0 0 44px}
  main{padding:12px 12px 40px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:8px 10px}.tile b{font-size:18px}
  .status{flex-direction:column;align-items:stretch}
  .pager{justify-content:space-between}
  .fh{padding:8px 10px}
  thead{display:none}
  table,tbody{display:block}
  tr{display:grid;grid-template-columns:auto 1fr auto;gap:1px 8px;padding:7px 10px;border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:0}
  td{padding:0;border:0}
  td.c-name{font-weight:600}
  td.c-epic,td.c-rel,td.c-house,td.links{grid-column:2/-1}
  td.c-house:not(:empty)::before{content:"House ";color:var(--muted)}
  td.c-sl{color:var(--muted)}
}
@media (max-width:380px){
  .bar{padding:10px 12px;gap:7px}
  .actions{gap:6px}
  .actions button{font-size:13px;padding:4px}
  .actions .theme{flex:0 0 38px}
  .srow select{max-width:40%;padding:6px 4px}
  main{padding:10px 8px 40px}
  .tile{padding:7px 8px}
}

.back{color:var(--accent);text-decoration:none;font-weight:600;align-self:center;white-space:nowrap}
.back:hover{text-decoration:underline}
.ask{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;color:var(--muted)}
.ask b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.ask p{margin:0}
.ask ol{display:block;width:fit-content;text-align:left;margin:12px auto 0;padding-left:20px}
.gz{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
td.c-fam a{color:var(--accent);text-decoration:none;white-space:nowrap}
td.c-fam a:hover{text-decoration:underline}
td.c-sec{font-size:12px;color:var(--muted);max-width:260px}
td.c-booth{white-space:nowrap}
select:disabled{opacity:.55}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow-x:auto}
.sum table{display:table;width:100%}
.sum thead{display:table-header-group}
.sum tbody{display:table-row-group}
.sum tr{display:table-row;padding:0}
.sum th,.sum td{display:table-cell;padding:6px 10px;border-bottom:1px solid var(--line)}
.sum td.n,.sum th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum tr.w{cursor:pointer}
.sum tr.w:hover,.sum tr.b:hover{background:var(--soft)}
.sum tr.b{cursor:pointer}
.sum tr.w td:first-child{font-weight:600;white-space:nowrap}
.sum tr.b td:first-child{padding-left:30px;white-space:nowrap}
.sum tr.tot td{font-weight:700;background:var(--soft)}
.sum .tg{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
.sum tr.open .tg{transform:rotate(90deg)}
.sum a.op{color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
.sum a.op:hover{text-decoration:underline}
.sum .acs{color:var(--muted);font-size:12.5px;font-weight:400;white-space:normal}
@media (max-width:700px){
  .back{grid-column:1/-1}
  td.c-booth,td.c-fam,td.c-sec{grid-column:2/-1}
  td.c-booth::before{content:"Booth ";color:var(--muted)}
  td.c-fam:not(:empty)::before{content:"Family ";color:var(--muted)}
  .sum .opt{display:none}
  .sum th,.sum td{padding:6px 5px}
  .sum tr.b td:first-child{padding-left:20px}
  .sum tr.w td:first-child,.sum tr.b td:first-child{white-space:normal}
  .sum td.n,.sum th.n{padding:6px 5px}
}

const PAGE = 100;
const RT = {F: 'Father', M: 'Mother', H: 'Husband', O: 'Other'};
const cache = {}, waiters = {};
let cur = null, rows = [], shown = [], page = 0;
let mode = 'ask';                // ask | wards | booths | list
const open = new Set();          // wards expanded in the all-wards table
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const pad = w => String(w).padStart(3, '0');

try { const t = localStorage.getItem('famTheme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$('theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const now = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = now === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('famTheme', next); } catch (e) {}
};

// AC names come from the ward's "158-Kolkata Port, 159-…" label
function acNames(info) {
  const m = {};
  for (const part of info.acs.split(',')) { const x = part.trim().match(/^(\d+)-(.*)$/); if (x) m[+x[1]] = x[2]; }
  return m;
}

const gzOf = w => w.booths.reduce((s, b) => s + b[2], 0);
$('ward').innerHTML += `<option value="all">All wards (${fmt(INDEX.reduce((s, w) => s + gzOf(w), 0))} GenZ)</option>` + INDEX.map(w => {
  const n = w.booths.reduce((s, b) => s + b[2], 0);
  return `<option value="${w.w}">Ward ${w.w} — ${esc(w.acs)} (${fmt(n)} GenZ)</option>`;
}).join('');

window.__genzLoaded = d => {
  for (const r of d.rows) r.t = [r[3], r[4], r[8], r[9], r[10]].join(' ').toLowerCase();
  cache[d.ward] = d;
  for (const ok of waiters[d.ward] || []) ok(d);
  delete waiters[d.ward];
};
function fetchGenz(w) {
  if (cache[w]) return Promise.resolve(cache[w]);
  return new Promise((ok, fail) => {
    if (waiters[w]) return waiters[w].push(ok);
    waiters[w] = [ok];
    const s = document.createElement('script');
    s.src = 'data/g' + pad(w) + '.js';
    s.onerror = () => { delete waiters[w]; fail(w); };
    document.head.appendChild(s);
  });
}

function ask(step) {
  mode = 'ask';
  $('tiles').innerHTML = ''; $('count').textContent = '';
  $('pager').innerHTML = $('pager2').innerHTML = '';
  $('xlsx').disabled = $('csv').disabled = true;
  $('list').innerHTML = `<div class="ask"><b>${step === 1 ? 'Select a ward — or “All wards” for ward-wise counts' : 'Now select a booth'}</b>
    <p>Every voter aged 18 to 30 in the chosen booth will be listed, with all their details.</p>
    <ol><li${step === 1 ? ' style="font-weight:600;color:var(--ink)"' : ''}>Pick the <b style="display:inline;font-size:inherit">Ward</b></li>
    <li${step === 2 ? ' style="font-weight:600;color:var(--ink)"' : ''}>Pick a <b style="display:inline;font-size:inherit">Booth</b> (or “All booths in ward”)</li>
    <li>View, search, or download the list</li></ol></div>`;
}

function wardChanged(keepBooth) {
  const w = +$('ward').value, sel = $('booth');
  $('note').innerHTML = '';
  if ($('ward').value === 'all') {
    cur = null; sel.disabled = true;
    sel.innerHTML = '<option value="">— pick a ward first —</option>';
    saveHash(); return wardSummary();
  }
  if (!w) {
    cur = null; sel.disabled = true;
    sel.innerHTML = '<option value="">— Select booth —</option>';
    saveHash(); return ask(1);
  }
  const info = INDEX.find(x => x.w === w);
  const multi = new Set(info.booths.map(b => b[0])).size > 1;
  sel.innerHTML = '<option value="">— Select booth —</option>' +
    `<option value="*">All booths in ward (${fmt(info.booths.reduce((s, b) => s + b[2], 0))})</option>` +
    info.booths.map(b => `<option value="${b[0]}-${esc(b[1])}">${multi ? 'AC ' + b[0] + ' · ' : ''}Booth ${esc(b[1])} (${fmt(b[2])})</option>`).join('') +
    info.miss.map(m => `<option disabled>AC ${m[0]} · Booth ${esc(m[1])} — no roll</option>`).join('');
  sel.disabled = false;
  sel.value = keepBooth && [...sel.options].some(o => o.value === keepBooth && !o.disabled) ? keepBooth : '';
  if (info.miss.length)
    $('note').innerHTML = `<div class="note">No voter roll yet for booth${info.miss.length > 1 ? 's' : ''} ${info.miss.map(m => m[0] + '/' + m[1]).join(', ')} (AC/booth).</div>`;
  cur = null;
  if (!sel.value) boothSummary(w);   // counts come from the index: show them at once
  else $('list').innerHTML = '<div class="empty">Loading ward ' + w + '…</div>';
  fetchGenz(w).then(d => { if (+$('ward').value === w) { cur = d; boothChanged(); } },
    () => { $('list').innerHTML = '<div class="empty">Could not load GenZ data for ward ' + w + '.</div>'; });
}

function boothChanged() {
  page = 0;
  if (!cur) return;
  const bk = $('booth').value;
  saveHash();
  if (!bk) { rows = []; return boothSummary(cur.ward); }
  rows = bk === '*' ? cur.rows : cur.rows.filter(r => r[0] + '-' + r[1] === bk);
  apply();
}

function boothOrder() {
  const info = INDEX.find(x => x.w === cur.ward), o = {};
  info.booths.forEach((b, i) => { o[b[0] + '-' + b[1]] = i; });
  return o;
}

  const bo = boothOrder();
  const byBooth = (a, b) => (bo[a[0] + '-' + a[1]] - bo[b[0] + '-' + b[1]]) || a[2] - b[2];
  shown.sort(so === 'age' ? (a, b) => a[5] - b[5] || byBooth(a, b)
    : so === 'name' ? (a, b) => a[4].localeCompare(b[4]) || byBooth(a, b) : byBooth);

  const info = INDEX.find(x => x.w === cur.ward), bk = $('booth').value;
  const men = rows.filter(r => r[6] === 'M').length, women = rows.filter(r => r[6] === 'F').length;
  const fam = rows.filter(r => r[11] !== '').length;
  const where = bk === '*' ? `Ward ${cur.ward}` : `Booth ${bk.split('-').slice(1).join('-')}`;
  $('tiles').innerHTML = [
    ['GenZ voters', fmt(rows.length), bk === '*' ? `${(100 * rows.length / info.v).toFixed(1)}% of ward voters` : where],
    ['Men', fmt(men), rows.length ? (100 * men / rows.length).toFixed(1) + '%' : ''],
    ['Women', fmt(women), rows.length ? (100 * women / rows.length).toFixed(1) + '%' : ''],
    ['In a family', fmt(fam), rows.length ? (100 * fam / rows.length).toFixed(1) + '% of GenZ' : ''],
  ].map(([k, v, s]) => `<div class="tile"><small>${k}</small><b>${v}</b><small>${esc(s)}</small></div>`).join('');
  $('count').textContent = `${where}: ${fmt(shown.length)} GenZ voters shown`;
  $('xlsx').disabled = $('csv').disabled = false;
  $('xlsx').textContent = `⬇ XLSX: ${where}`;
  $('xlsx').title = "Download this ward or booth's GenZ list as Excel";
  render();
}

// ---- count tables -------------------------------------------------------
const SUMHEAD = ['GenZ', 'Men', 'Women', 'In a family', 'All voters', 'GenZ %'];
const OPT = [false, true, true, true, true, false];       // columns hidden on phones
function nums(n, m, f, fam, v) {
  return [n, m, f, fam, v, v ? (100 * n / v).toFixed(1) + '%' : '–'];
}
function cells(vals) {
  return vals.map((x, i) => `<td class="n${OPT[i] ? ' opt' : ''}">${typeof x === 'number' ? fmt(x) : x}</td>`).join('');
}
function boothNums(b) { return nums(b[2], b[3], b[4], b[5], b[6]); }
function totals(list) {
  const t = [0, 0, 0, 0, 0];
  for (const w of list) for (const b of w.booths) for (let i = 0; i < 5; i++) t[i] += b[i + 2];
  return t;
}
function wardNums(w) { return nums(...totals([w])); }
function head(first) {
  return `<thead><tr><th>${first}</th>` + SUMHEAD.map((h, i) => `<th class="n${OPT[i] ? ' opt' : ''}">${h}</th>`).join('') + '<th></th></tr></thead>';
}
function boothRows(w, multi) {
  return w.booths.map(b => `<tr class="b" data-w="${w.w}" data-b="${b[0]}-${esc(b[1])}">
    <td>${multi ? 'AC ' + b[0] + ' · ' : ''}Booth ${esc(b[1])}</td>${cells(boothNums(b))}
    <td><a class="op" href="#w=${w.w}&b=${b[0]}-${encodeURIComponent(b[1])}">Open<span class="opt"> list</span> →</a></td></tr>`).join('');
}
function sumTiles(list, label) {
  const t = totals(list);
  $('tiles').innerHTML = [
    ['GenZ voters', fmt(t[0]), t[4] ? (100 * t[0] / t[4]).toFixed(1) + '% of ' + fmt(t[4]) + ' voters' : label],
    ['Men', fmt(t[1]), t[0] ? (100 * t[1] / t[0]).toFixed(1) + '%' : ''],
    ['Women', fmt(t[2]), t[0] ? (100 * t[2] / t[0]).toFixed(1) + '%' : ''],
    ['In a family', fmt(t[3]), t[0] ? (100 * t[3] / t[0]).toFixed(1) + '% of GenZ' : ''],
  ].map(([k, v, s]) => `<div class="tile"><small>${k}</small><b>${v}</b><small>${esc(s)}</small></div>`).join('');
}
function summaryChrome(label) {
  $('pager').innerHTML = $('pager2').innerHTML = '';
  $('xlsx').disabled = $('csv').disabled = false;
  $('xlsx').textContent = `⬇ XLSX: ${label}`;
  $('xlsx').title = 'Download the GenZ counts shown in the table, as Excel';
}

function wardSummary() {
  mode = 'wards';
  sumTiles(INDEX, 'All wards');
  $('count').textContent = `GenZ voters in all ${INDEX.length} wards — tap a ward to see its booths`;
  summaryChrome('All wards');
  $('list').innerHTML = `<div class="sum"><table>${head('Ward')}<tbody>
    <tr class="tot"><td>All wards</td>${cells(nums(...totals(INDEX)))}<td></td></tr>` +
    INDEX.map(w => {
      const multi = new Set(w.booths.map(b => b[0])).size > 1, isOpen = open.has(w.w);
      return `<tr class="w${isOpen ? ' open' : ''}" data-toggle="${w.w}"><td><span class="tg">▸</span> Ward ${w.w}
        <div class="acs">${esc(w.acs)} · ${w.booths.length} booths</div></td>${cells(wardNums(w))}
        <td><a class="op" href="#w=${w.w}">Open<span class="opt"> ward</span> →</a></td></tr>` + (isOpen ? boothRows(w, multi) : '');
    }).join('') + '</tbody></table></div>';
}

function boothSummary(wn) {
  mode = 'booths';
  const w = INDEX.find(x => x.w === wn), multi = new Set(w.booths.map(b => b[0])).size > 1;
  sumTiles([w], 'Ward ' + wn);
  $('count').textContent = `Ward ${wn}: GenZ voters booth-wise — tap a booth to list its voters`;
  summaryChrome(`Ward ${wn}`);
  $('list').innerHTML = `<div class="sum"><table>${head('Booth')}<tbody>
    <tr class="tot"><td>Ward ${wn} total</td>${cells(wardNums(w))}<td><a class="op" href="#w=${wn}&b=*">Open<span class="opt"> all</span> →</a></td></tr>` +
    boothRows(w, multi) + '</tbody></table></div>';
}

// clicks in the count tables: expand a ward, or open a ward / booth list
function openFrom(w, b) {
  $('ward').value = w;
  wardChanged(b || '');
  window.scrollTo({top: 0});
}
$('list').addEventListener('click', e => {
  if (mode !== 'wards' && mode !== 'booths') return;
  const a = e.target.closest('a.op');
  if (a) {
    e.preventDefault();
    const h = new URLSearchParams(a.getAttribute('href').slice(1));
    return openFrom(h.get('w'), h.get('b'));
  }
  const t = e.target.closest('tr[data-toggle]');
  if (t) {
    const w = +t.dataset.toggle;
    open.has(w) ? open.delete(w) : open.add(w);
    return wardSummary();
  }
  const b = e.target.closest('tr.b[data-b]');
  if (b) openFrom(b.dataset.w, b.dataset.b);
});

function hl(s, q) {
  s = esc(s);
  if (!q) return s;
  const e = esc(q), i = s.toLowerCase().indexOf(e);
  return i < 0 ? s : s.slice(0, i) + '<mark>' + s.slice(i, i + e.length) + '</mark>' + s.slice(i + e.length);
}

function famId(r) { return r[11] === '' ? '' : `W${cur.ward}-${r[0]}-${r[1]}-F${r[11]}`; }

function render() {
  const pages = Math.max(1, Math.ceil(shown.length / PAGE));
  page = Math.min(page, pages - 1);
  const q = $('q').value.trim().toLowerCase();
  const multi = new Set(rows.map(r => r[0])).size > 1;
  const slice = shown.slice(page * PAGE, page * PAGE + PAGE);
  $('list').innerHTML = slice.length ? `<div class="gz tw"><table><thead><tr><th>Sl</th><th>Name</th><th>Sex/Age</th>
    <th>EPIC</th><th>Relation</th><th>House</th><th>Booth</th><th>Family</th><th>Section</th></tr></thead><tbody>` +
    slice.map(r => {
      const fid = famId(r);
      const link = fid ? `<a href="index.html#w=${cur.ward}&b=${r[0]}-${encodeURIComponent(r[1])}&q=${encodeURIComponent(r[3])}"
        title="Open this family in the family browser">${esc(fid.split('-').pop())} ↗</a>` : '';
      return `<tr><td class="num c-sl">${r[2]}</td><td class="c-name">${hl(r[4], q)}</td>
        <td class="num c-sa"><span class="sx ${r[6]}">${r[6] || '?'}</span> ${r[5]}</td>
        <td class="epic c-epic">${hl(r[3], q)}</td>
        <td class="rel c-rel">${RT[r[7]] || esc(r[7])}: ${hl(r[8], q)}</td>
        <td class="c-house">${hl(r[9], q)}</td>
        <td class="c-booth">${multi ? r[0] + '/' : ''}${esc(r[1])}</td>
        <td class="c-fam">${link}</td>
        <td class="c-sec">${hl(r[10], q)}</td></tr>`;
    }).join('') + '</tbody></table></div>' : '<div class="empty">No GenZ voters match.</div>';
  const pg = pages > 1 ? `<button data-p="${page - 1}" ${page ? '' : 'disabled'}>‹ Prev</button>
    <span>Page ${page + 1} of ${fmt(pages)}</span>
    <button data-p="${page + 1}" ${page < pages - 1 ? '' : 'disabled'}>Next ›</button>` : '';
  $('pager').innerHTML = pg; $('pager2').innerHTML = pg;
}
for (const id of ['pager', 'pager2']) $(id).onclick = e => {
  const p = e.target.dataset.p;
  if (p === undefined) return;
  page = +p; render(); window.scrollTo({top: 0});
};

function saveHash() {
  const h = new URLSearchParams();
  if ($('ward').value) h.set('w', $('ward').value);
  if ($('booth').value) h.set('b', $('booth').value);
  history.replaceState(null, '', h.toString() ? '#' + h : location.pathname);
  $('back').href = 'index.html' + (+$('ward').value ? '#w=' + $('ward').value +
    ($('booth').value && $('booth').value !== '*' ? '&b=' + encodeURIComponent($('booth').value) : '') : '');
}

const HEAD = ['Ward', 'AC No', 'AC Name', 'Booth', 'Serial No', 'EPIC', 'Name', 'Age', 'Sex', 'Relation Type',
  'Relation Name', 'House No', 'Section', 'Family ID'];
function table(list) {
  const names = acNames(INDEX.find(x => x.w === cur.ward));
  return [HEAD].concat(list.map(r => [cur.ward, r[0], names[r[0]] || '', r[1], r[2], r[3], r[4], r[5], r[6],
    RT[r[7]] || r[7], r[8], r[9], r[10], famId(r)]));
}
function fileBase() {
  const bk = $('booth').value;
  return `KMC_GenZ_Ward_${cur.ward}` + (bk === '*' ? '' : `_AC${bk.split('-')[0]}_Booth_${bk.split('-').slice(1).join('-')}`);
}
function countTable() {
  const out = [['Ward', 'AC No', 'Booth', 'ACs', ...SUMHEAD]];
  const wards = mode === 'wards' ? INDEX : [INDEX.find(x => x.w === +$('ward').value)];
  for (const w of wards) {
    if (mode === 'wards') out.push([w.w, '', 'All', w.acs, ...wardNums(w)]);
    for (const b of w.booths) out.push([w.w, b[0], b[1], w.acs, ...boothNums(b)]);
  }
  return out;
}
function countName() { return mode === 'wards' ? 'KMC_GenZ_Counts_All_Wards' : `KMC_GenZ_Counts_Ward_${$('ward').value}`; }

$('xlsx').onclick = () => {
  if (!window.XLSX) return alert('The Excel library could not be loaded (no internet?). Use the CSV button instead.');
  if (mode === 'wards' || mode === 'booths') {
    const ws = XLSX.utils.aoa_to_sheet(countTable());
    ws['!cols'] = [6, 6, 7, 32, 8, 8, 8, 10, 10, 8].map(w => ({wch: w}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'GenZ counts');
    return XLSX.writeFile(wb, countName() + '.xlsx');
  }
  const ws = XLSX.utils.aoa_to_sheet(table(rows.slice().sort((a, b) => a[0] - b[0] || a[2] - b[2])));
  ws['!cols'] = [6, 6, 18, 7, 7, 14, 28, 5, 5, 10, 28, 14, 40, 18].map(w => ({wch: w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'GenZ 18-30');
  XLSX.writeFile(wb, fileBase() + '.xlsx');
};
const toCsv = t => '\ufeff' + t.map(r => r.map(c => /[",\n]/.test(c) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join(',')).join('\n');
$('csv').onclick = () => {
  if (mode === 'wards' || mode === 'booths') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([toCsv(countTable())], {type: 'text/csv'}));
    a.download = countName() + '.csv';
    return a.click();
  }
  const csv = '\ufeff' + table(shown).map(r => r.map(c => /[",\n]/.test(c) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = fileBase() + '_shown.csv';
  a.click();
};

let qt;
$('q').oninput = () => { clearTimeout(qt); qt = setTimeout(() => { page = 0; apply(); }, 200); };
$('sex').onchange = $('sort').onchange = () => { page = 0; apply(); };
$('booth').onchange = boothChanged;
$('ward').onchange = () => wardChanged('');

const h = new URLSearchParams(location.hash.slice(1));
if (h.get('w') === 'all') { $('ward').value = 'all'; wardChanged(''); }
else if (INDEX.some(x => x.w === +h.get('w'))) { $('ward').value = h.get('w'); wardChanged(h.get('b') || ''); }
else ask(1);
</script>
</body>
</html>
