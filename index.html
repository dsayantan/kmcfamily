<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMC Family Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--muted:#5f6b7a;--line:#e3e7ec;--soft:#f0f3f6;
  --accent:#b3261e;--accent-ink:#fff;--hl:#fff1a8;--m:#2f6fb3;--f:#b5418a;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417;--panel:#1b1e23;--ink:#e7eaee;--muted:#9aa5b1;--line:#2c3138;--soft:#22262c;
  --accent:#e35d52;--accent-ink:#fff;--hl:#5c4d00;--m:#7fb2ea;--f:#e58cc4;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#121417;--panel:#1b1e23;--ink:#e7eaee;--muted:#9aa5b1;--line:#2c3138;--soft:#22262c;
  --accent:#e35d52;--accent-ink:#fff;--hl:#5c4d00;--m:#7fb2ea;--f:#e58cc4;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Noto Sans Bengali",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
h1{font-size:17px;margin:0 16px 0 0;align-self:center;white-space:nowrap}
h1 span{color:var(--accent)}
label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px;font-weight:500}
select,input,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-height:34px}
select{max-width:320px}
input[type=search]{width:230px}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
main{max-width:1200px;margin:0 auto;padding:14px 16px 60px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted)}
.note{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px;color:var(--muted)}
.status{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:4px 0 10px;color:var(--muted)}
.pager{display:flex;gap:6px;align-items:center}
.fam{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.fh{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line)}
.fh .id{font-weight:700}
.fh .meta{color:var(--muted);font-size:12.5px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sx{font-weight:600}.sx.M{color:var(--m)}.sx.F{color:var(--f)}
.epic{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:nowrap}
.rel{color:var(--muted);font-size:12.5px}
.links{font-size:12px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.theme{margin-left:auto}
.actions{display:flex;gap:8px;align-items:end}
@media (max-width:700px){
  header{position:static}
  .bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  h1,.wide,.actions{grid-column:1/-1}
  label{min-width:0}
  select,input[type=search]{width:100%;min-width:0;max-width:none}
  .actions button{flex:1;min-height:40px;white-space:nowrap;padding:6px}
  .actions .theme{flex:0 0 44px}
  main{padding:12px 12px 40px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:8px 10px}.tile b{font-size:18px}
  .status{flex-direction:column;align-items:stretch}
  .pager{justify-content:space-between}
  .fh{padding:8px 10px}
  thead{display:none}
  table,tbody{display:block}
  tr{display:grid;grid-template-columns:auto 1fr auto;gap:1px 8px;padding:7px 10px;border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:0}
  td{padding:0;border:0}
  td.c-name{font-weight:600}
  td.c-epic,td.c-rel,td.c-house,td.links{grid-column:2/-1}
  td.c-house:not(:empty)::before{content:"House ";color:var(--muted)}
  td.c-sl{color:var(--muted)}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

"52.3","booths":[[152,"276",181,516],[152,"277",174,454],[152,"288",135,317],[152,"289",226,595],[152,"290",178,484],[152,"291",211,564],[152,"292",161,454],[152,"293",178,496],[152,"294",214,561],[152,"295",215,533],[152,"296",240,683],[152,"297",203,525],[152,"298",166,450],[152,"299",120,326],[152,"300",154,426],[152,"301",181,495]],"miss":[]}];
const PAGE = 50;
const RT = {F:'Father',M:'Mother',H:'Husband',O:'Other'};
const cache = {};
let cur = null, shown = [], page = 0, pending = null;
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

try { const t = localStorage.getItem('famTheme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$('theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const now = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = now === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('famTheme', next); } catch (e) {}
};

$('ward').innerHTML = INDEX.map(w =>
  `<option value="${w.w}">Ward ${w.w} — ${esc(w.acs)} (${fmt(w.fam)} families)</option>`).join('');

window.__wardLoaded = d => {
  cache[d.ward] = d;
  for (const b of d.booths) {
    b.key = b.ac + '-' + b.b;
    for (const f of b.fam) {
      f.booth = b;
      f.minsl = Math.min(...f[1].map(m => +m[0] || 0));
      f.text = f[1].map(m => [m[1], m[2], m[6], m[7]].join(' ')).join(' ').toLowerCase();
    }
  }
  if (pending === d.ward) { pending = null; show(d.ward); }
};

function loadWard(w) {
  if (cache[w]) return show(w);
  pending = w;
  $('list').innerHTML = '<div class="empty">Loading ward ' + w + '…</div>';
  const s = document.createElement('script');
  s.src = 'data/w' + String(w).padStart(3, '0') + '.js';
  s.onerror = () => { $('list').innerHTML = '<div class="empty">Could not load data for ward ' + w + '.</div>'; };
  document.head.appendChild(s);
}

function show(w) {
  cur = cache[w];
  const info = INDEX.find(x => x.w === w);
  $('tiles').innerHTML = [
    ['Voters', fmt(info.v), info.nb + ' booths'],
    ['Families', fmt(info.fam), 'groups of 2 or more'],
    ['Voters in families', fmt(info.inf), info.pct + '% of voters'],
    ['Avg family size', info.fam ? (info.inf / info.fam).toFixed(2) : '–', info.acs],
  ].map(([k, v, s]) => `<div class="tile"><small>${k}</small><b>${v}</b><small>${esc(s)}</small></div>`).join('');
  const miss = info.miss.map(m => m[0] + '/' + m[1]);
  $('note').innerHTML = miss.length
    ? `<div class="note">No voter roll yet for booth${miss.length > 1 ? 's' : ''} ${miss.join(', ')} (AC/booth) — not analysed.</div>` : '';
  const sel = $('booth'), keep = sel.value;
  const opts = cur.booths.map(b => `<option value="${b.key}">AC ${b.ac} · Booth ${esc(b.b)} (${b.fam.length})</option>`);
  sel.innerHTML = '<option value="">All booths</option>' + opts.join('') +
    info.miss.map(m => `<option disabled>AC ${m[0]} · Booth ${esc(m[1])} — no roll</option>`).join('');
  sel.value = cur.booths.some(b => b.key === keep) ? keep : '';
  page = 0;
  apply();
}

function apply() {
  if (!cur) return;
  const bk = $('booth').value, min = +$('minsz').value, q = $('q').value.trim().toLowerCase();
  shown = [];
  for (const b of cur.booths) {
    if (bk && b.key !== bk) continue;
    for (const f of b.fam) if (f[1].length >= min && (!q || f.text.includes(q))) shown.push(f);
  }
  if ($('sort').value === 'size') shown.sort((a, b) => b[1].length - a[1].length || a.minsl - b.minsl);
  const ppl = shown.reduce((s, f) => s + f[1].length, 0);
  $('count').textContent = `${fmt(shown.length)} families · ${fmt(ppl)} voters`;
  saveHash();
  xlsxLabel();
  render();
}

function hl(s, q) {
  s = esc(s);
  if (!q) return s;
  const i = s.toLowerCase().indexOf(esc(q));
  return i < 0 ? s : s.slice(0, i) + '<mark>' + s.slice(i, i + esc(q).length) + '</mark>' + s.slice(i + esc(q).length);
}

function links(str, mem) {
  if (!str) return '';
  const bySl = {};
  for (const m of mem) bySl[m[0]] = m[2];
  // each link is "<relation> of <EPIC>/<serial>"; old EPICs contain slashes too
  return str.split(';').map(seg => {
    const m = seg.trim().match(/^(.*?) of (.*)\/(\d+)$/);
    return m ? `${esc(m[1])} of ${esc(bySl[m[3]] || m[2])} (${m[3]})` : esc(seg.trim());
  }).join('; ');
}

function render() {
  const pages = Math.max(1, Math.ceil(shown.length / PAGE));
  page = Math.min(page, pages - 1);
  const q = $('q').value.trim().toLowerCase();
  const slice = shown.slice(page * PAGE, page * PAGE + PAGE);
  $('list').innerHTML = slice.length ? slice.map(f => {
    const b = f.booth, mem = f[1];
    const houses = [...new Set(mem.map(m => m[7]).filter(Boolean))];
    const rows = mem.map(m => `<tr>
      <td class="num c-sl">${m[0]}</td>
      <td class="c-name">${hl(m[2], q)}</td>
      <td class="num c-sa"><span class="sx ${m[4]}">${m[4] || '?'}</span> ${m[3]}</td>
      <td class="epic c-epic">${hl(m[1], q)}</td>
      <td class="rel c-rel">${RT[m[5]] || esc(m[5])}: ${hl(m[6], q)}</td>
      <td class="c-house">${hl(m[7], q)}</td>
      <td class="links">${links(m[8], mem)}</td></tr>`).join('');
    return `<div class="fam"><div class="fh">
      <span class="id">W${cur.ward}-${b.ac}-${esc(b.b)}-F${f[0]}</span>
      <span class="meta">AC ${b.ac} ${esc(b.acn)} · Booth ${esc(b.b)}</span>
      <span class="meta">${mem.length} members</span>
      <span class="meta">House ${esc(houses.join(', ') || '–')}</span></div>
      <div class="tw"><table><thead><tr><th>Sl</th><th>Name</th><th>Sex/Age</th><th>EPIC</th>
      <th>Relation</th><th>House</th><th class="links">Linked as</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join('') : '<div class="empty">No families match.</div>';
  const pg = pages > 1 ? `<button data-p="${page - 1}" ${page ? '' : 'disabled'}>‹ Prev</button>
    <span>Page ${page + 1} of ${fmt(pages)}</span>
    <button data-p="${page + 1}" ${page < pages - 1 ? '' : 'disabled'}>Next ›</button>` : '';
  $('pager').innerHTML = pg; $('pager2').innerHTML = pg;
}
for (const id of ['pager', 'pager2']) $(id).onclick = e => {
  const p = e.target.dataset.p;
  if (p === undefined) return;
  page = +p; render(); window.scrollTo({top: 0});
};

function saveHash() {
  const h = new URLSearchParams({w: cur.ward});
  if ($('booth').value) h.set('b', $('booth').value);
  history.replaceState(null, '', '#' + h);
}

function xlsxLabel() {
  const bk = $('booth').value;
  const b = cur && cur.booths.find(x => x.key === bk);
  $('xlsx').textContent = b ? `⬇ XLSX: Booth ${b.b}` : `⬇ XLSX: Ward ${cur ? cur.ward : ''}`;
}

$('xlsx').onclick = () => {
  if (!cur) return;
  const bk = $('booth').value;
  const booths = cur.booths.filter(b => !bk || b.key === bk);
  const name = bk ? `KMC_Ward_${cur.ward}_AC${booths[0].ac}_Booth_${booths[0].b}_Families.xlsx`
                  : `KMC_Ward_${cur.ward}_Families.xlsx`;
  if (!window.XLSX) {
    alert('The Excel library could not be loaded (no internet?). Use the CSV button instead.');
    return;
  }
  const fam = [['Ward', 'AC No', 'AC Name', 'Booth', 'Family ID', 'Size', 'House No(s)',
    'Family Members (EPIC, Serial No, Sex, Age)']];
  const mem = [['Ward', 'AC No', 'AC Name', 'Booth', 'Family ID', 'Serial No', 'EPIC', 'Name', 'Age', 'Sex',
    'Relation Type', 'Relation Name', 'House No', 'Inferred Links']];
  for (const b of booths) for (const f of b.fam) {
    const fid = `W${cur.ward}-${b.ac}-${b.b}-F${f[0]}`;
    const houses = [...new Set(f[1].map(m => m[7]).filter(Boolean))].sort().join(', ');
    fam.push([cur.ward, b.ac, b.acn, b.b, fid, f[1].length, houses,
      f[1].map(m => `${m[2]} (${m[1]}, ${m[0]}, ${m[4] || '?'}, ${m[3] === '' ? '?' : m[3]})`).join('; ')]);
    for (const m of f[1]) mem.push([cur.ward, b.ac, b.acn, b.b, fid, m[0], m[1], m[2], m[3], m[4],
      RT[m[5]] || m[5], m[6], m[7], m[8]]);
  }
  const wb = XLSX.utils.book_new();
  const s1 = XLSX.utils.aoa_to_sheet(fam), s2 = XLSX.utils.aoa_to_sheet(mem);
  s1['!cols'] = [6, 6, 18, 7, 20, 5, 18, 120].map(w => ({wch: w}));
  s2['!cols'] = [6, 6, 18, 7, 20, 7, 14, 28, 5, 5, 10, 28, 12, 60].map(w => ({wch: w}));
  XLSX.utils.book_append_sheet(wb, s1, 'Families');
  XLSX.utils.book_append_sheet(wb, s2, 'Members');
  XLSX.writeFile(wb, name);
};

$('csv').onclick = () => {
  const out = [['Ward', 'AC No', 'AC Name', 'Booth', 'Family ID', 'Size', 'Serial No', 'EPIC', 'Name', 'Sex', 'Age',
    'Relation Type', 'Relation Name', 'House No', 'Linked as']];
  for (const f of shown) for (const m of f[1]) {
    const b = f.booth;
    out.push([cur.ward, b.ac, b.acn, b.b, `W${cur.ward}-${b.ac}-${b.b}-F${f[0]}`, f[1].length,
      m[0], m[1], m[2], m[4], m[3], RT[m[5]] || m[5], m[6], m[7], m[8]]);
  }
  const csv = '﻿' + out.map(r => r.map(c => /[",\n]/.test(c) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = `ward_${cur.ward}${$('booth').value ? '_booth_' + $('booth').value : ''}_families.csv`;
  a.click();
};

let qt;
$('q').oninput = () => { clearTimeout(qt); qt = setTimeout(() => { page = 0; apply(); }, 200); };
$('minsz').onchange = $('sort').onchange = () => { page = 0; apply(); };
$('booth').onchange = () => { page = 0; apply(); };
$('ward').onchange = () => { $('booth').value = ''; loadWard(+$('ward').value); };

const h = new URLSearchParams(location.hash.slice(1));
const w0 = INDEX.some(x => x.w === +h.get('w')) ? +h.get('w') : INDEX[0].w;
$('ward').value = w0;
if (h.get('b')) $('booth').innerHTML += `<option value="${esc(h.get('b'))}"></option>`, $('booth').value = h.get('b');
loadWard(w0);
</script>
</body>
</html>
